name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  GO_VERSION: "1.24"
  PNPM_VERSION: "12.16.1"

jobs:
  check:
    name: Lint, uji, dan e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pasang pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Cache store pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Pasang ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Format
        run: |
          pnpm exec prettier --check "src/**/*.{ts,tsx,css}"
          test -z "$(gofmt -l server)" || { gofmt -l server; exit 1; }

      - name: Lint skrip
        run: |
          bash -n scripts/*.sh
          shellcheck -S error scripts/*.sh

      - name: Tipe
        run: |
          pnpm check
          go vet ./...

      - name: Uji unit
        run: pnpm test

      - name: Uji e2e
        run: pnpm e2e
